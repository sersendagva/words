<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English-Mongolian Touch Match</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:15px;background:#f0f4f8;}
h2{text-align:center;color:#1e3c5c;}
.container{background:#fff;padding:15px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
.columns{display:flex;justify-content:space-between;gap:10px;}
.column{width:50%;}
.english-item,.mongolian-item{
  padding:12px;margin:6px 0;border-radius:12px;min-height:50px;font-size:16px;
}
.english-item{background:#e8f0fe;border:2px solid #4a90e2;position:relative;}
.mongolian-item{background:#fff5e6;border:2px solid #e67e22;cursor:pointer;}
.english-item.correct{background:#d4edda;border-color:#28a745;}
.english-item.wrong{background:#f8d7da;border-color:#dc3545;}
.checkmark{position:absolute;top:5px;right:10px;font-size:18px;font-weight:bold;}
button{padding:10px 15px;margin:5px 3px;border:none;border-radius:8px;background:#1e3c5c;color:white;}
button:active{transform:scale(0.95);}
.scoreboard{margin:10px 0;font-weight:bold;}
#timerBox{display:none;margin:10px 0;font-weight:bold;}
@media (max-width:768px){
  .columns{flex-direction:column;}
  .column{width:100%;}
  .english-item,.mongolian-item{font-size:18px;}
  button{width:100%;margin:6px 0;}
}
</style>
</head>
<body>

<h2>English 🇲🇳 Mongolian Touch Match Test</h2>

<div class="container">

<input type="number" id="timeInput" value="30" min="0"> мин
<button id="startBtn">▶ Эхлэх</button>
<button id="resetBtn">⟲ Шинэ эхлэх</button>

<div id="timerBox">⏳ <span id="timer"></span></div>
<div class="scoreboard" id="scoreboard">✅ 0/0 | ❌ 0</div>

<div id="quiz"></div>

<div>
<button id="prevBtn">◀ Өмнөх</button>
<span id="pageInfo"></span>
<button id="nextBtn">Дараах ▶</button>
</div>

<button id="checkBtn">✅ Шалгах</button>
<button id="retryBtn">🔄 Буруу дахин</button>

<div id="result"></div>
</div>

<script>
let words=[], originalWords=[], answers={}, wrongList=[];
let timerInterval,totalSeconds,currentPage=0;
let PAGE_SIZE=5;
let selectedIndex=null;

/* CSV LOAD */
window.onload=function(){
  fetch("word1.csv")
  .then(res=>res.text())
  .then(data=>{
    const lines=data.split(/\r?\n/);
    for(let i=0;i<lines.length;i++){
      const parts=lines[i].split(",");
      if(parts.length>=2) originalWords.push([parts[0].trim(),parts[1].trim()]);
    }
  }).catch(()=>alert("word1.csv олдсонгүй"));
};

/* SHUFFLE */
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}

/* START */
function startQuiz(){
  if(originalWords.length===0){alert("CSV ачаалагдаагүй"); return;}
  words=shuffle(originalWords); answers={}; wrongList=[]; currentPage=0;
  startTimer(); renderPage();
}

/* PAGE LOGIC */
function getTotalPages(){
  const full=Math.floor(words.length/PAGE_SIZE);
  const rem=words.length%PAGE_SIZE;
  if(rem>0 && rem<5 && full>0) return full;
  return Math.ceil(words.length/PAGE_SIZE);
}
function getRange(page){
  const total=getTotalPages();
  if(page===total-1) return {start:(total-1)*PAGE_SIZE,end:words.length};
  return {start:page*PAGE_SIZE,end:page*PAGE_SIZE+PAGE_SIZE};
}

/* RENDER */
function renderPage(){
  const range=getRange(currentPage);
  let html='<div class="columns"><div class="column"><h3>АНГЛИ</h3>';
  for(let i=range.start;i<range.end;i++){
    html+='<div class="english-item" id="word-'+i+'">'+words[i][0]+'</div>';
  }
  html+='</div><div class="column"><h3>МОНГОЛ</h3>';
  let meanings=[]; for(let i=range.start;i<range.end;i++) meanings.push(words[i][1]);
  meanings=shuffle(meanings);
  for(let i=0;i<meanings.length;i++){
    html+='<div class="mongolian-item">'+meanings[i]+'</div>';
  }
  html+='</div></div>';
  document.getElementById("quiz").innerHTML=html;

  // Touch-friendly events
  document.querySelectorAll('.english-item').forEach((el,i)=>{
    el.addEventListener('touchstart',()=>{selectedIndex=i;});
  });
  document.querySelectorAll('.mongolian-item').forEach((el)=>{
    el.addEventListener('touchstart',()=>{
      if(selectedIndex===null) return;
      for(let k in answers){if(answers[k]===el.innerText) delete answers[k];}
      answers[selectedIndex]=el.innerText;
      selectedIndex=null;
      highlightAssigned();
    });
  });

  highlightAssigned(); updatePageInfo();
}

/* HIGHLIGHT */
function highlightAssigned(){
  for(let i=0;i<words.length;i++){
    const div=document.getElementById("word-"+i);
    if(!div) continue;
    div.classList.remove("correct","wrong");
    const old=div.querySelector(".checkmark"); if(old) old.remove();
    if(answers[i]){
      if(answers[i]===words[i][1]){div.classList.add("correct"); addCheck(div,"✅");}
      else{div.classList.add("wrong"); addCheck(div,"❌");}
    }
  }
  updateScoreboard();
}
function addCheck(el,sym){const sp=document.createElement("span"); sp.className="checkmark"; sp.innerHTML=sym; el.appendChild(sp);}
function checkAnswers(){let correct=0; wrongList=[]; for(let i=0;i<words.length;i++){if(answers[i]===words[i][1]) correct++; else if(answers[i]) wrongList.push(words[i]); document.getElementById("result").innerHTML="📊 "+correct+"/"+words.length;}}
function retryWrong(){if(wrongList.length===0) return; words=shuffle(wrongList); answers={}; wrongList=[]; currentPage=0; renderPage();}
function resetQuiz(){words=shuffle(originalWords); answers={}; wrongList=[]; currentPage=0; renderPage();}

/* TIMER */
function startTimer(){let mins=parseInt(document.getElementById("timeInput").value); if(isNaN(mins)||mins<=0){document.getElementById("timerBox").style.display='none'; return;}
totalSeconds=mins*60; document.getElementById("timerBox").style.display='block'; updateTimer();
if(timerInterval) clearInterval(timerInterval);
timerInterval=setInterval(()=>{totalSeconds--; if(totalSeconds<0){clearInterval(timerInterval); checkAnswers(); alert("⏰ Дууслаа");} else updateTimer();},1000);}
function updateTimer(){let m=Math.floor(totalSeconds/60); let s=totalSeconds%60; if(s<10)s="0"+s; document.getElementById("timer").innerHTML=m+":"+s;}

/* NAV */
document.getElementById("startBtn").addEventListener("click",startQuiz);
document.getElementById("resetBtn").addEventListener("click",resetQuiz);
document.getElementById("prevBtn").addEventListener("click",()=>{if(currentPage>0){currentPage--; renderPage();}});
document.getElementById("nextBtn").addEventListener("click",()=>{if(currentPage+1<getTotalPages()){currentPage++; renderPage();}});
document.getElementById("checkBtn").addEventListener("click",checkAnswers);
document.getElementById("retryBtn").addEventListener("click",retryWrong);

function updatePageInfo(){document.getElementById("pageInfo").innerHTML="Хуудас "+(currentPage+1)+" / "+getTotalPages();}
function updateScoreboard(){let c=0,w=0; for(let i=0;i<words.length;i++){if(answers[i]===words[i][1]) c++; else if(answers[i]) w++; document.getElementById("scoreboard").innerHTML="✅ "+c+"/"+words.length+" | ❌ "+w;}
</script>

</body>
</html>
